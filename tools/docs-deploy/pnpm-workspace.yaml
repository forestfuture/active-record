# The Wrangler that CI's docs-deploy job runs (#243). This file makes the folder a workspace of its
# own, so the root's `vp install` never sees it and its install never reads the site's lockfile.
# Wrangler is pinned exactly; Dependabot (.github/dependabot.yml) keeps it current. The folder sits
# outside .github/, where Dependabot couldn't open pull requests for it (#554).
packages:
  - .
# New releases wait a week (in minutes), as in the root's pnpm-workspace.yaml (#424).
minimumReleaseAge: 10080
