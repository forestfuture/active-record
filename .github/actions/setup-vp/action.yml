name: Set up Vite+
description: Installs Vite+ (the version pinned in pnpm-workspace.yaml), Node (.node-version) and pnpm, then runs `vp install`. Check out the repository first.
inputs:
  release:
    description: >
      "true" for a job that decides, builds, versions or publishes a release (#80): dependencies
      install without running their install scripts, and without the shared dependency cache.
    default: "false"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.release != 'true' }}
        run-install: ${{ inputs.release != 'true' }}
    - if: inputs.release == 'true'
      shell: bash
      run: vp install --frozen-lockfile --ignore-scripts
